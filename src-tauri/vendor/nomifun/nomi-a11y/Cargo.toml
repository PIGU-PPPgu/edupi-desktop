# Modified for EduPi: workspace dependencies were replaced by local adapter dependencies.
[package]
name = "nomi-a11y"
description = "NomiFun cross-platform accessibility tree adapted for EduPi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/nomifun/nomifun-desktop"

[dependencies]
nomi-types = { path = "../nomi-types" }
tracing = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSArray", "NSString", "NSError", "NSDictionary", "NSValue"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-vision = { version = "0.3", features = ["VNRequest", "VNRecognizeTextRequest", "VNRequestHandler", "VNObservation", "VNTypes", "VNGeometry", "objc2-core-foundation"] }

[target.'cfg(target_os = "windows")'.dependencies]
uiautomation = "0.25"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation", "Foundation_Collections", "Globalization"] }

[target.'cfg(target_os = "linux")'.dependencies]
atspi = "0.30"
zbus = { version = "5", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
