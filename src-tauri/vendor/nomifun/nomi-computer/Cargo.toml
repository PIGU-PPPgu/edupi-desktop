# Modified for EduPi: workspace dependencies were replaced by local adapter dependencies.
[package]
name = "nomi-computer"
description = "NomiFun computer-use core adapted for EduPi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/nomifun/nomifun-desktop"

[dependencies]
nomi-types = { path = "../nomi-types" }
nomi-protocol = { path = "../nomi-protocol" }
nomi-config = { path = "../nomi-config" }
nomi-tools = { path = "../nomi-tools" }
nomi-a11y = { path = "../nomi-a11y" }
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
async-trait = "0.1"
xcap = "0.9"
enigo = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
open = { version = "5", features = ["shellexecute-on-windows"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
dispatch2 = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
