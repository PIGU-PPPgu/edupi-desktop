[package]
name = "pi-agent-desktop"
version = "0.3.89"
description = "Desktop shell for Pi Agent"
authors = ["pi-agent-desktop contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.90.0"

[workspace]
resolver = "2"
default-members = ["."]
members = [
  "vendor/security-patches/tao",
  "vendor/security-patches/atspi-common",
  "vendor/security-patches/notify-rust",
  "vendor/security-patches/tauri-plugin-single-instance",
  "vendor/security-patches/xcap",
]
exclude = [
  "vendor/nomifun/nomi-computer",
  "vendor/nomifun/nomi-a11y",
  "vendor/nomifun/nomi-types",
  "vendor/nomifun/nomi-config",
  "vendor/nomifun/nomi-protocol",
  "vendor/nomifun/nomi-tools",
  "vendor/security-patches/atspi-connection",
  "vendor/security-patches/atspi-proxies",
  "vendor/security-patches/libappindicator",
  "vendor/security-patches/libappindicator-sys",
  "vendor/security-patches/muda",
  "vendor/security-patches/rfd",
  "vendor/security-patches/tauri",
  "vendor/security-patches/tauri-plugin-updater",
  "vendor/security-patches/tauri-runtime",
  "vendor/security-patches/tauri-runtime-wry",
  "vendor/security-patches/webkit2gtk",
  "vendor/security-patches/webkit2gtk-sys",
  "vendor/security-patches/wry",
  "vendor/security-patches/zbus-lockstep",
  "vendor/security-patches/zbus-lockstep-macros",
  "vendor/security-patches/rav1e",
  "vendor/security-patches/pulp",
]

[lib]
name = "pi_agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
dunce = "1"
getrandom = "0.3"
libc = "0.2"
nomi-computer = { path = "vendor/nomifun/nomi-computer" }
nomi-config = { path = "vendor/nomifun/nomi-config" }
nomi-tools = { path = "vendor/nomifun/nomi-tools" }
nomi-types = { path = "vendor/nomifun/nomi-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.14.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
# Keep the existing notification integration on its reviewed version.
notify-rust = "=4.17.0"

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
tauri-plugin-single-instance = "2.4.3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.4"
objc2-foundation = "=0.3.2"
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
tauri-winrt-notification = "=0.7.3"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.3.0"
tauri = { version = "2.12.5", features = ["test"] }

[target.'cfg(unix)'.dev-dependencies]
# The stream regression API is unstable; keep the tested library exact.
zip = { version = "=9.0.5", default-features = false }

[patch.crates-io]
# Upstream ba98bfa: retain updater 2.14 and move its Windows ZIP reader to v9.
tauri-plugin-updater = { path = "vendor/security-patches/tauri-plugin-updater" }
# Maintained GTK/GLib bindings; Linux requires Rust 1.92.
tauri = { path = "vendor/security-patches/tauri" }
tauri-runtime = { path = "vendor/security-patches/tauri-runtime" }
tauri-runtime-wry = { path = "vendor/security-patches/tauri-runtime-wry" }
tao = { path = "vendor/security-patches/tao" }
wry = { path = "vendor/security-patches/wry" }
muda = { path = "vendor/security-patches/muda" }
webkit2gtk = { path = "vendor/security-patches/webkit2gtk" }
webkit2gtk-sys = { path = "vendor/security-patches/webkit2gtk-sys" }
libappindicator = { path = "vendor/security-patches/libappindicator" }
libappindicator-sys = { path = "vendor/security-patches/libappindicator-sys" }
rfd = { path = "vendor/security-patches/rfd" }
# Preserve the existing Linux integrations while moving D-Bus types to zbus 6.
notify-rust = { path = "vendor/security-patches/notify-rust" }
tauri-plugin-single-instance = { path = "vendor/security-patches/tauri-plugin-single-instance" }
xcap = { path = "vendor/security-patches/xcap" }
atspi-common = { path = "vendor/security-patches/atspi-common" }
atspi-connection = { path = "vendor/security-patches/atspi-connection" }
atspi-proxies = { path = "vendor/security-patches/atspi-proxies" }
zbus-lockstep = { path = "vendor/security-patches/zbus-lockstep" }
zbus-lockstep-macros = { path = "vendor/security-patches/zbus-lockstep-macros" }
rav1e = { path = "vendor/security-patches/rav1e" }
pulp = { path = "vendor/security-patches/pulp" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
