name: Verify the published Linux desktop build

# Manual acceptance only. This installs the published Debian package in a
# clean Ubuntu runner, starts the packaged app under Xvfb, and checks the
# bundled Core through the real loopback server.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published Linux version to install
        required: true

permissions:
  contents: read

jobs:
  published-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the workflow helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true

      - name: Check out the published Core compatibility pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          path: .edupi-published-source
          sparse-checkout: contracts
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            curl \
            xvfb \
            libgtk-3-0 \
            libwebkit2gtk-4.1-0 \
            libayatana-appindicator3-1 \
            librsvg2-2

      - name: Download the published Debian package
        env:
          GH_TOKEN: ${{ github.token }}
          EDUPI_TEST_RELEASE: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/edupi-release"
          gh release download "$EDUPI_TEST_RELEASE" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*_amd64.deb' \
            --dir "$RUNNER_TEMP/edupi-release"

      - name: Install the published package and verify isolated Core startup
        shell: bash
        env:
          EDUPI_TEST_RELEASE: ${{ inputs.tag }}
          EDUPI_LINUX_INSTALLER_DIR: ${{ runner.temp }}/edupi-release
          EDUPI_LINUX_COMPAT_PATH: ${{ github.workspace }}/.edupi-published-source/contracts/edupi-core-compat.json
        run: bash scripts/test-linux-route1-install.sh

      - name: Keep Linux installation evidence
        if: always() && env.EDUPI_LINUX_INSTALL_EVIDENCE != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-linux-install-evidence
          path: ${{ env.EDUPI_LINUX_INSTALL_EVIDENCE }}
          if-no-files-found: error
