name: Verify the published Linux desktop build

# Manual acceptance only. This installs the published Debian package in a
# clean Ubuntu runner, starts the packaged app under Xvfb, and checks the
# bundled Core through the real loopback server.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published Linux version to install
        required: true
        default: v0.3.7

permissions:
  contents: read

jobs:
  published-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the workflow helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            curl \
            xvfb \
            libgtk-3-0 \
            libwebkit2gtk-4.1-0 \
            libayatana-appindicator3-1 \
            librsvg2-2

      - name: Download the published Debian package
        env:
          GH_TOKEN: ${{ github.token }}
          EDUPI_TEST_RELEASE: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/edupi-release"
          gh release download "$EDUPI_TEST_RELEASE" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*_amd64.deb' \
            --dir "$RUNNER_TEMP/edupi-release"
          deb="$(find "$RUNNER_TEMP/edupi-release" -name '*_amd64.deb' -type f -print -quit)"
          test -n "$deb"
          expected="${EDUPI_TEST_RELEASE#v}"
          actual="$(dpkg-deb -f "$deb" Version)"
          test "$actual" = "$expected"
          echo "EDUPI_DEB=$deb" >> "$GITHUB_ENV"

      - name: Install the published package
        run: |
          sudo apt-get install --yes "$EDUPI_DEB"

      - name: Start the installed application and verify Core readiness
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/edupi-linux-smoke"
          mkdir -p "$smoke_root/workspace" "$smoke_root/home" "$smoke_root/state"
          binary="$(dpkg-deb -L "$EDUPI_DEB" | awk '/^\/usr\/bin\// { print; exit }')"
          test -x "$binary"
          xvfb-run --auto-servernum --server-args='-screen 0 1280x900x24' \
            env HOME="$smoke_root/home" \
              EDUPI_DATA_ROOT="$smoke_root/workspace" \
              EDUPI_DATA_ALLOWED_ROOT="$smoke_root" \
              EDUPI_PROJECT_ROOT="$smoke_root/workspace" \
              PI_DESKTOP_STATE_DIR="$smoke_root/state" \
              "$binary" >"$smoke_root/app.log" 2>&1 &
          app_pid=$!
          cleanup() { kill "$app_pid" 2>/dev/null || true; }
          trap cleanup EXIT

          ready_port=""
          for _ in $(seq 1 120); do
            for port in $(seq 38471 38480); do
              payload="$(curl --silent --show-error --max-time 2 "http://127.0.0.1:$port/api/edupi/status?summary=1" || true)"
              if printf '%s' "$payload" | python3 -c 'import json,sys; d=json.load(sys.stdin); raise SystemExit(0 if d.get("core",{}).get("status")=="ready" and d.get("projection",{}).get("status")=="ready" else 1)' 2>/dev/null; then
                ready_port="$port"
                break 2
              fi
            done
            sleep 2
          done
          test -n "$ready_port"
          curl --fail --silent --show-error "http://127.0.0.1:$ready_port/api/edupi/status?summary=1" | tee "$smoke_root/status.json"
          grep -q '"status":"ready"' "$smoke_root/status.json"
