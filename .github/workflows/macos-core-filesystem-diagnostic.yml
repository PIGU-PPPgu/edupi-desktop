name: Inspect macOS Core filesystem

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up matching Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
      - name: Read native filesystem evidence
        shell: bash
        run: |
          set -euo pipefail
          probe_dir="$RUNNER_TEMP/edupi-core-fs-$GITHUB_RUN_ID"
          mkdir -m 700 "$probe_dir"
          trap 'test "$probe_dir" = "$RUNNER_TEMP/edupi-core-fs-$GITHUB_RUN_ID" && rm -r "$probe_dir"' EXIT
          /usr/bin/clang -Wall -Wextra -Werror scripts/macos-filesystem-diagnostic.c -o "$probe_dir/probe"
          node scripts/inspect-macos-core-filesystem.mjs "$probe_dir/probe"
