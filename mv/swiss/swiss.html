<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>EduPi · Swiss Motion</title>
<style>
@font-face{font-family:Inter;font-weight:400;src:url(fonts/inter-latin-400-normal.woff2)}
@font-face{font-family:Inter;font-weight:500;src:url(fonts/inter-latin-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(fonts/inter-latin-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(fonts/inter-latin-800-normal.woff2)}
:root{--page:#EFEEE9;--paper:#FFFFFF;--ink:#111111;--g1:#DAD9D4;--g2:#BDBCB6;--g3:#8C8B86;--sig:#1F3FFF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--page);font-family:Inter,"PingFang SC","Heiti SC",sans-serif;color:var(--ink);font-kerning:normal}
#st{position:absolute;left:0;top:0;width:1920px;height:1080px;background:var(--page);overflow:hidden}
.scene{position:absolute;inset:0;display:none}
.abs{position:absolute}
.clip{position:absolute;overflow:hidden}
.clip>span{display:block;white-space:pre;will-change:transform}
.note{font-size:19px;font-weight:500;color:var(--g3);letter-spacing:.01em}
.rule{position:absolute;height:1px;background:var(--ink)}
#wipe{position:absolute;inset:0;background:var(--ink);z-index:100;display:none}
#sig{position:absolute;inset:0;background:var(--sig);z-index:101;display:none}
img.fr{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;transform-origin:0 0}
</style></head><body><div id="st"></div><div id="wipe"></div><div id="sig"></div>
<script src="build/data.js"></script><script src="swiss.js"></script></body></html>
